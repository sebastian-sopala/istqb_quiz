<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platforma Quizowa ISTQB - Kompletny Trening</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card);
            max-width: 900px;
            width: 100%;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .menu-subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 40px;
        }

        /* UI Karty Zestawów */
        .sets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .set-card {
            border: 2px solid #e2e8f0;
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #fff;
        }

        .set-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.1);
        }

        .set-card h3 {
            margin-bottom: 10px;
            color: var(--text);
        }

        .set-card .q-count {
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* Quiz UI */
        .hidden {
            display: none !important;
        }

        .header-bar {
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .option {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }

        .option.selected {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .option.correct {
            background: #f0fdf4 !important;
            border-color: var(--correct) !important;
            color: #14532d;
            font-weight: bold;
        }

        .option.incorrect {
            background: #fef2f2 !important;
            border-color: var(--incorrect) !important;
            color: #7f1d1d;
        }

        .justification {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 6px solid var(--primary);
            margin: 20px 0;
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="menu-section">
            <h1>Platforma Quizowa ISTQB</h1>
            <p class="menu-subtitle" id="status-msg">Inicjalizacja danych...</p>
            <div id="sets-grid" class="sets-grid"></div>
        </div>

        <div id="quiz-section" class="hidden">
            <div class="header-bar">
                <h2 id="quiz-title">Zestaw</h2>
                <div id="progress-text" style="color: var(--muted)">Pytanie 1/40</div>
            </div>
            <div class="question-text" id="question-body"></div>
            <div id="options-container"></div>
            <div id="justification-box" class="justification hidden"></div>
            <button id="action-btn" class="btn hidden">Dalej</button>
            <button class="btn" style="background:#64748b; margin-top:20px;" onclick="location.reload()">Wróć do
                menu</button>
        </div>

        <div id="results-section" class="hidden" style="text-align: center;">
            <h2 style="font-size: 2rem; margin-bottom: 20px;">Koniec testu!</h2>
            <div style="font-size: 3rem; color: var(--primary); font-weight: 800; margin-bottom: 20px;">
                <span id="final-score">0</span> / <span id="final-total">0</span>
            </div>
            <button class="btn" onclick="location.reload()">Rozwiąż jeszcze raz</button>
        </div>
    </div>

    <script>
        let fullDatabase = { "Zbiór A": [], "Zbiór B": [], "Zbiór C": [], "Zbiór D": [], "Dodatkowe": [] };
        let currentQuiz = [];
        let currentIdx = 0;
        let score = 0;
        let answered = false;
        let selected = [];

        async function init() {
            const files = ['1_quiz_data.json', '2_quiz_data.json', '3_quiz_data.json', '4_quiz_data.json'];
            const statusMsg = document.getElementById('status-msg');

            try {
                const results = await Promise.all(files.map(f => fetch(f).then(r => r.json())));

                results.forEach(data => {
                    // Logika łączenia: szukamy słów kluczowych w kluczach obiektów JSON
                    for (const [key, questions] of Object.entries(data)) {
                        // Sprawdzamy czy to obiekt zagnieżdżony (jak w pliku nr 3) czy płaski
                        let targetQuestions = Array.isArray(questions) ? questions : Object.values(questions)[0];

                        if (key.includes('Zbiór A') || key.includes('Dodatkowe')) {
                            if (key.includes('Dodatkowe')) fullDatabase["Dodatkowe"].push(...targetQuestions);
                            else fullDatabase["Zbiór A"].push(...targetQuestions);
                        }
                        else if (key.includes('Zbiór B')) fullDatabase["Zbiór B"].push(...targetQuestions);
                        else if (key.includes('Zbiór C')) fullDatabase["Zbiór C"].push(...targetQuestions);
                        else if (key.includes('Zbiór D')) fullDatabase["Zbiór D"].push(...targetQuestions);
                    }
                });

                renderMenu();
                statusMsg.innerText = "Wybierz zestaw pytań, aby rozpocząć symulację egzaminu.";
            } catch (e) {
                statusMsg.innerText = "Błąd ładowania plików JSON. Upewnij się, że pliki znajdują się w tym samym folderze.";
                console.error(e);
            }
        }

        function renderMenu() {
            const grid = document.getElementById('sets-grid');
            grid.innerHTML = '';

            for (const [name, questions] of Object.entries(fullDatabase)) {
                if (questions.length === 0) continue;

                const card = document.createElement('div');
                card.className = 'set-card';
                card.innerHTML = `
                    <h3>${name}</h3>
                    <p class="q-count">${questions.length} pytań</p>
                    <button class="btn" style="margin-top:15px">Rozpocznij</button>
                `;
                card.onclick = () => startQuiz(name, questions);
                grid.appendChild(card);
            }
        }

        function startQuiz(name, questions) {
            currentQuiz = questions;
            currentIdx = 0; score = 0;
            document.getElementById('menu-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('quiz-title').innerText = name;
            loadQuestion();
        }

        function loadQuestion() {
            answered = false; selected = [];
            const q = currentQuiz[currentIdx];
            const isMulti = Array.isArray(q.correctIndex);

            document.getElementById('progress-text').innerText = `Pytanie ${currentIdx + 1} / ${currentQuiz.length}`;
            document.getElementById('question-body').innerText = q.question;
            document.getElementById('justification-box').classList.add('hidden');
            document.getElementById('action-btn').classList.add('hidden');

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => {
                    if (answered) return;
                    if (isMulti) {
                        const sIdx = selected.indexOf(i);
                        if (sIdx > -1) {
                            selected.splice(sIdx, 1);
                            div.classList.remove('selected');
                        } else {
                            selected.push(i);
                            div.classList.add('selected');
                        }
                        document.getElementById('action-btn').classList.remove('hidden');
                        document.getElementById('action-btn').innerText = "Sprawdź odpowiedź";
                    } else {
                        checkSingle(i, div);
                    }
                };
                container.appendChild(div);
            });

            if (isMulti) {
                const btn = document.getElementById('action-btn');
                btn.onclick = checkMulti;
            }
        }

        function checkSingle(idx, el) {
            answered = true;
            const q = currentQuiz[currentIdx];
            const opts = document.querySelectorAll('.option');

            if (idx === q.correctIndex) {
                el.classList.add('correct');
                score++;
            } else {
                el.classList.add('incorrect');
                opts[q.correctIndex].classList.add('correct');
            }
            showFinishStep();
        }

        function checkMulti() {
            if (selected.length === 0) return;
            answered = true;
            const q = currentQuiz[currentIdx];
            const opts = document.querySelectorAll('.option');

            let isCorrect = selected.length === q.correctIndex.length &&
                selected.every(v => q.correctIndex.includes(v));

            selected.forEach(idx => {
                if (q.correctIndex.includes(idx)) opts[idx].classList.add('correct');
                else opts[idx].classList.add('incorrect');
            });

            q.correctIndex.forEach(idx => {
                if (!selected.includes(idx)) opts[idx].classList.add('correct');
            });

            if (isCorrect) score++;
            showFinishStep();
        }

        function showFinishStep() {
            const q = currentQuiz[currentIdx];
            const box = document.getElementById('justification-box');
            box.innerHTML = `<strong>Uzasadnienie:</strong><br>${q.justification}`;
            box.classList.remove('hidden');

            const btn = document.getElementById('action-btn');
            btn.classList.remove('hidden');
            btn.innerText = (currentIdx === currentQuiz.length - 1) ? "Zobacz wyniki" : "Następne pytanie";
            btn.onclick = () => {
                currentIdx++;
                if (currentIdx < currentQuiz.length) loadQuestion();
                else showResults();
            };
        }

        function showResults() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('results-section').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-total').innerText = currentQuiz.length;
        }

        init();
    </script>
</body>

</html>
