<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISTQB CTFL 4.0 - Platforma Treningowa</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --correct-color: #16a34a;
            --incorrect-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 900px;
            width: 100%;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }

        #menu-section h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .menu-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .sets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option.selected-option {
            background-color: #eff6ff;
            border-color: var(--primary-color);
        }

        .option.correct {
            background-color: #f0fdf4 !important;
            border-color: var(--correct-color) !important;
            color: #14532d;
            font-weight: 500;
        }

        .option.incorrect {
            background-color: #fef2f2 !important;
            border-color: var(--incorrect-color) !important;
            color: #7f1d1d;
        }

        #justification-container {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 6px solid var(--primary-color);
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="menu-section">
            <h1>Platforma Quizowa ISTQB</h1>
            <p class="menu-subtitle">Wybierz zbiór pytań CTFL 4.0</p>
            <div id="sets-grid" class="sets-grid"></div>
        </div>

        <div id="quiz-section" class="hidden">
            <h2 id="quiz-title" style="margin-bottom: 5px;"></h2>
            <div id="progress-text" style="color: var(--text-muted); margin-bottom: 15px; font-weight: bold;"></div>
            <div class="question" id="question-text"></div>
            <div class="options-list" id="options-container"></div>
            <div id="justification-container" class="hidden"></div>
            <button id="next-btn" class="btn hidden">Następne pytanie</button>
            <button class="btn" style="margin-top: 15px; background-color: #64748b;" onclick="location.reload()">Wróć do
                Menu</button>
        </div>

        <div id="results-container" class="hidden" style="text-align: center;">
            <h2>Podsumowanie</h2>
            <div style="font-size: 2.5rem; margin: 20px 0; color: var(--primary-color);">
                Wynik: <span id="score-points">0</span> / <span id="total-points">0</span>
            </div>
            <button class="btn" onclick="location.reload()">Zacznij od nowa</button>
        </div>
    </div>

    <script>
        let currentQuizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;
        let selectedOptions = [];

        // Funkcja pobierająca dane z pliku JSON
        async function loadQuizDatabase() {
            const grid = document.getElementById('sets-grid');
            const subtitle = document.querySelector('.menu-subtitle');

            try {
                // Pobieramy plik z serwera (na GitHub Pages to zadziała bez błędu CORS)
                const response = await fetch('quiz_data.json');
                if (!response.ok) throw new Error("Nie znaleziono pliku quiz_data.json");

                const data = await response.json();
                subtitle.innerText = "Wybierz zestaw pytań, aby rozpocząć darmowy test.";
                grid.innerHTML = '';

                // Tworzymy przyciski dla każdego zbioru z JSONa
                for (const [setName, questions] of Object.entries(data)) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = setName;
                    btn.onclick = () => startQuiz(setName, questions);
                    grid.appendChild(btn);
                }

                // Przycisk MIX (wszystkie pytania razem)
                const mixBtn = document.createElement('button');
                mixBtn.className = 'btn';
                mixBtn.innerText = 'Wszystkie zbiory (Mix)';
                mixBtn.style.backgroundColor = 'var(--correct-color)';
                mixBtn.onclick = () => {
                    let allQuestions = [];
                    Object.values(data).forEach(qArr => allQuestions = allQuestions.concat(qArr));
                    startQuiz('Wszystkie zbiory (Mix)', allQuestions);
                };
                grid.appendChild(mixBtn);

            } catch (error) {
                console.error(error);
                subtitle.innerText = "Błąd: Nie można załadować pytań. Upewnij się, że plik quiz_data.json znajduje się w tym samym folderze na GitHubie.";
            }
        }

        function startQuiz(title, questionsData) {
            document.getElementById('menu-section').classList.add('hidden');
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');

            document.getElementById('quiz-title').innerText = title;
            currentQuizData = questionsData;
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('total-points').innerText = currentQuizData.length;

            loadQuestion();
        }

        function loadQuestion() {
            hasAnswered = false;
            selectedOptions = [];
            const currentQ = currentQuizData[currentQuestionIndex];

            document.getElementById('progress-text').innerText = `Pytanie ${currentQuestionIndex + 1} / ${currentQuizData.length}`;
            document.getElementById('question-text').innerText = currentQ.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            document.getElementById('justification-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const isMultiple = Array.isArray(currentQ.correctIndex);

            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerText = option;

                btn.onclick = () => {
                    if (hasAnswered) return;
                    if (isMultiple) {
                        const idx = selectedOptions.indexOf(index);
                        if (idx > -1) {
                            selectedOptions.splice(idx, 1);
                            btn.classList.remove('selected-option');
                        } else {
                            selectedOptions.push(index);
                            btn.classList.add('selected-option');
                        }
                    } else {
                        handleOptionClickSingle(index, btn);
                    }
                };
                optionsContainer.appendChild(btn);
            });

            if (isMultiple) {
                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'btn';
                confirmBtn.innerText = 'Sprawdź odpowiedź';
                confirmBtn.style.marginTop = '15px';
                confirmBtn.style.backgroundColor = '#f59e0b';
                confirmBtn.onclick = handleConfirmMultiple;
                optionsContainer.appendChild(confirmBtn);
            }
        }

        function handleOptionClickSingle(selectedIndex, optionElement) {
            hasAnswered = true;
            const currentQ = currentQuizData[currentQuestionIndex];
            const allOptions = document.querySelectorAll('.option');

            if (selectedIndex === currentQ.correctIndex) {
                optionElement.classList.add('correct');
                score++;
            } else {
                optionElement.classList.add('incorrect');
                allOptions[currentQ.correctIndex].classList.add('correct');
            }
            showJustification();
        }

        function handleConfirmMultiple() {
            if (selectedOptions.length === 0) return;
            hasAnswered = true;
            const currentQ = currentQuizData[currentQuestionIndex];
            const allOptions = document.querySelectorAll('.option');

            let isCorrect = true;
            selectedOptions.forEach(idx => {
                if (currentQ.correctIndex.includes(idx)) {
                    allOptions[idx].classList.add('correct');
                } else {
                    allOptions[idx].classList.add('incorrect');
                    isCorrect = false;
                }
            });

            currentQ.correctIndex.forEach(idx => {
                if (!selectedOptions.includes(idx)) {
                    allOptions[idx].classList.add('correct');
                    isCorrect = false;
                }
            });

            if (isCorrect) score++;
            showJustification();
        }

        function showJustification() {
            const currentQ = currentQuizData[currentQuestionIndex];
            const justContainer = document.getElementById('justification-container');
            justContainer.innerHTML = `<strong>Uzasadnienie:</strong><br>${currentQ.justification}`;
            justContainer.classList.remove('hidden');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = currentQuestionIndex === currentQuizData.length - 1 ? "Pokaż wyniki" : "Następne pytanie";
            nextBtn.classList.remove('hidden');
        }

        document.getElementById('next-btn').onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizData.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-section').classList.add('hidden');
                document.getElementById('results-container').classList.remove('hidden');
                document.getElementById('score-points').innerText = score;
            }
        };

        // Uruchomienie ładowania bazy przy starcie
        loadQuizDatabase();
    </script>
</body>

</html>
